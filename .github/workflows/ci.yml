name: CI - Quality & Data Integrity Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: "Validación de Código y Datos"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar sintaxis y compilación Python
        run: |
          python -m compileall python/ tests/

      - name: Ejecutar pruebas unitarias de integridad de datos y SQL
        run: |
          python -m unittest discover -s tests -v

      - name: Ejecutar dry-run de pipeline de limpieza
        run: |
          python python/clean_pipeline.py
